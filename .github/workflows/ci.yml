name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # GHCR yêu cầu tên image viết thường.
  IMAGE_NAME: ghcr.io/darkb2001/knowledge-gym-app

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build + test (includes ArchUnit)
        run: ./gradlew build

      - name: Observability contracts and runtime canary (local fixtures only)
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/kg-observability"
          mkdir -p "$tools"
          python3 -m venv "$tools/venv"
          "$tools/venv/bin/pip" install PyYAML==6.0.3
          "$tools/venv/bin/python" scripts/verify-observability.py
          agent_url="https://github.com/open-telemetry/opentelemetry-java-instrumentation"
          agent_release="$agent_url/releases/download/v2.32.0"
          curl -fsSL --retry 2 "$agent_release/opentelemetry-javaagent.jar" \
            -o "$tools/otel-javaagent.jar"
          # Gradle verifies the same fixed SHA-256 as the Dockerfile.
          ./gradlew :kg-presentation:telemetryAgentTest \
            -PotelAgentPath="$tools/otel-javaagent.jar"
          release="https://github.com/open-telemetry/opentelemetry-collector-releases"
          archive="otelcol-contrib_0.162.0_linux_amd64.tar.gz"
          url="$release/releases/download/v0.162.0/$archive"
          curl -fsSL --retry 2 "$url" -o "$tools/$archive"
          curl -fsSL --retry 2 "$url.sha256" -o "$tools/$archive.sha256"
          expected="$(tr -d '\r\n' < "$tools/$archive.sha256")"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$expected" "$archive" | \
            (cd "$tools" && sha256sum -c -)
          tar -xzf "$tools/$archive" -C "$tools"
          "$tools/venv/bin/python" scripts/test-observability-pipeline.py \
            --collector "$tools/otelcol-contrib"
          docker run --rm --network none --cap-drop ALL \
            --entrypoint /bin/promtool \
            -v "$PWD/infra/prometheus:/rules:ro" prom/prometheus:v2.53.0 \
            test rules /rules/observability-alerts.test.yml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  # Đẩy image lên GHCR để CT 102 chỉ cần `docker compose pull`.
  #
  # Lý do bắt buộc: build Gradle + JDK trong CT 8GB sẽ ngốn 2-3GB RAM đỉnh và
  # tranh I/O với CT100/CT101 trên cùng 1 NVMe (xem docker-compose.prod.yml).
  # Build ở CI rồi pull về là cách duy nhất giữ CT trong ngân sách RAM.
  #
  # Chỉ chạy trên push vào main — PR không được ghi vào packages.
  publish-image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-short-sha: sha-${{ steps.release.outputs.short_sha }}
      source-sha: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # `linux/amd64` vì CT 102 chạy trên Proxmox x86_64, không phải ARM.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image metadata
        id: release
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          {
            echo "### Published image"
            echo "- Tag: \`${IMAGE_NAME}:sha-${GITHUB_SHA:0:7}\`"
            echo "- Tag: \`${IMAGE_NAME}:latest\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Bắt buộc: `ADD <url>` để lại agent jar 0600 root:root. Nếu image đã
      # publish vẫn không đọc được nó dưới user `app`, container sẽ crash-loop
      # ngay khi overlay bật -javaagent - lỗi này không thể phát hiện bằng scan
      # hay unit test, chỉ lộ ra khi chạy thật trong image.
      - name: Runtime smoke gate (agent readable by non-root user)
        env:
          AGENT: /app/otel-javaagent.jar
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:sha-${GITHUB_SHA:0:7}"
          docker pull "$image"
          docker run --rm --network none --user app --entrypoint sh "$image" \
            -c "test -r $AGENT && java -javaagent:$AGENT -version"

  image-security:
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # GHCR package mặc định là private → không login thì Trivy pull sẽ 401 và
      # job đỏ vĩnh viễn, không phải vì có CVE. `packages: read` ở trên là phần
      # quyền tương ứng cho GITHUB_TOKEN.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln

  # Deploy prod bằng pull — KHÔNG build trên LXC 8GB.
  # Cần GitHub Environment `production` secrets:
  # DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_ROOT, TS_AUTHKEY.
  # job skip nếu DEPLOY_ENABLED không phải true.
  #
  # Đường mạng: runner GitHub không vào LAN nhà (WAN CGNAT,
  # không port-forward).
  # CT100 (192.168.1.14) quảng bá route 192.168.1.15/32 trong tailnet nên runner
  # chỉ cần join tailnet là SSH thẳng tới CT102 (action tự truyền
  # --accept-routes).
  deploy-prod:
    needs: [image-security, publish-image]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.darkb-tech.io.vn
    steps:
      # Runner GitHub ở ngoài internet; WAN nhà là CGNAT nên không port-forward.
      # CT100 quảng bá 192.168.1.15/32 trong tailnet → join tailnet là SSH được.
      - name: Join tailnet (accept-routes)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: '1.98.10'
          hostname: kg-ci-deploy

      # CT100 (subnet router) đôi lúc mất kết nối tới control plane vài phút
      # (journal có warnable not-in-map-poll) — chờ route sẵn sàng thay vì để
      # bước SSH fail ngay.
      - name: Wait for CT102 route over tailnet
        env:
          TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -uo pipefail
          echo "tailnet ip: $(tailscale ip -4 2>/dev/null || echo none)"
          for attempt in $(seq 1 30); do
            if timeout 5 bash -c \
                "exec 3<>/dev/tcp/${TARGET_HOST}/22" 2>/dev/null; then
              echo "TCP ${TARGET_HOST}:22 reachable after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: ${TARGET_HOST}:22 unreachable,"
            echo "retry in 5s"
            sleep 5
          done
          echo "::error::${TARGET_HOST}:22 unreachable after 30 attempts"
          tailscale status 2>&1 | head -20 || true
          exit 1

      - name: Deploy over SSH (pull + up)
        uses: appleboy/ssh-action@v1.2.0
        env:
          SOURCE_SHA: ${{ needs.publish-image.outputs.source-sha }}
          RELEASE_TAG: ${{ needs.publish-image.outputs.image-short-sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SOURCE_SHA,RELEASE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_ROOT || '/opt/kg' }}"
            test -n "$SOURCE_SHA"
            git fetch --prune origin main
            git reset --hard "$SOURCE_SHA"
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            git rev-parse HEAD
            image="ghcr.io/darkb2001/knowledge-gym-app:${RELEASE_TAG}"
            rollback="ghcr.io/darkb2001/knowledge-gym-app:rollback"
            if grep -q '^APP_IMAGE=' .env 2>/dev/null; then
              sed -i "s#^APP_IMAGE=.*#APP_IMAGE=$image#" .env
            else
              printf '\nAPP_IMAGE=%s\n' "$image" >> .env
            fi
            export APP_IMAGE="$image"
            compose=(docker compose -f docker-compose.prod.yml)
            # Preserve operator opt-in; never start the ops stack.
            obs_marker="${KG_OBSERVABILITY_MARKER:-$PWD/run/observability.enabled}"
            if [ -f "$obs_marker" ]; then
              test -f docker-compose.observability.yml
              docker network inspect kgops_telemetry >/dev/null
              compose+=(-f docker-compose.observability.yml)
            fi
            marker="${KG_ES_STOP_MARKER:-$PWD/run/elasticsearch.stopped}"

            # Preserve the exact image currently used by the app. This keeps
            # one rollback release even when `latest` has moved in GHCR.
            # Tên container do compose sinh (kg-app-1) nên tra theo service id
            # thay vì hardcode "app".
            current_app="$("${compose[@]}" ps -q app \
              2>/dev/null | head -1)"
            current_id="$(docker inspect --format '{{.Image}}' "$current_app" \
              2>/dev/null || true)"
            if [ -n "$current_id" ]; then
              docker tag "$current_id" "$rollback"
            elif docker image inspect \
                "${{ env.IMAGE_NAME }}:latest" >/dev/null 2>&1; then
              docker tag "${{ env.IMAGE_NAME }}:latest" "$rollback"
            fi

            "${compose[@]}" pull app
            "${compose[@]}" up -d --remove-orphans

            # nginx/prometheus bind-mount FILE cấu hình (nginx.prod.conf,
            # alerts.yml): `git reset --hard` phía trên tạo inode mới, container
            # cũ vẫn giữ inode cũ nên `up -d` KHÔNG đọc config mới. Buộc tạo lại
            # 2 container stateless này (~2s) để rule rate limit / alert vừa
            # deploy có hiệu lực thật. Lỗi ở đây không làm fail deploy.
            "${compose[@]}" up -d --force-recreate --no-deps nginx prometheus \
              || echo "CẢNH BÁO: nginx/prometheus có thể còn dùng config cũ"

            # An intentional ES stop must survive compose up.
            if [ -f "$marker" ]; then
              "${compose[@]}" stop elasticsearch
            fi

            healthy=false
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error \
                  --max-time 5 \
                  http://127.0.0.1/api/v1/actuator/health \
                  | grep -q '"status":"UP"'; then
                healthy=true
                break
              fi
              sleep 5
            done

            if [ "$healthy" != true ]; then
              echo "Health check failed; rolling back to $rollback" >&2
              APP_IMAGE="$rollback" "${compose[@]}" up -d app nginx
              # Keep .env in step with what is actually running: otherwise a
              # later manual `docker compose up -d` would re-pull the failed
              # sha tag (and start the broken release again).
              sed -i "s#^APP_IMAGE=.*#APP_IMAGE=$rollback#" .env
              docker image rm "$image" >/dev/null 2>&1 || true
              exit 1
            fi

            # Make the verified release the only current tag. Remove every
            # old sha tag so the host retains exactly latest + rollback.
            docker tag "$image" "${{ env.IMAGE_NAME }}:latest"
            docker image ls "${{ env.IMAGE_NAME }}" \
              --format '{{.Repository}}:{{.Tag}}' \
              | grep -E ':sha-[0-9a-f]+$' \
              | while IFS= read -r old_tag; do
                  docker image rm "$old_tag" >/dev/null 2>&1 || true
                done

            "${compose[@]}" ps app nginx
            echo "Deployed $image"
            docker image inspect "$image" \
              --format='image={{index .RepoDigests 0}}' || true
            # Remove only dangling layers; retain latest/rollback and volumes.
            docker image prune --force

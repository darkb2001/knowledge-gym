name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # GHCR yêu cầu tên image viết thường.
  IMAGE_NAME: ghcr.io/darkb2001/knowledge-gym-app

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build + test (includes ArchUnit)
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  # Đẩy image lên GHCR để CT 102 chỉ cần `docker compose pull`.
  #
  # Lý do bắt buộc: build Gradle + JDK trong CT 8GB sẽ ngốn 2-3GB RAM đỉnh và
  # tranh I/O với CT100/CT101 trên cùng 1 NVMe (xem docker-compose.prod.yml).
  # Build ở CI rồi pull về là cách duy nhất giữ CT trong ngân sách RAM.
  #
  # Chỉ chạy trên push vào main — PR không được ghi vào packages.
  publish-image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # `linux/amd64` vì CT 102 chạy trên Proxmox x86_64, không phải ARM.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-security:
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # GHCR package mặc định là private → không login thì Trivy pull sẽ 401 và
      # job đỏ vĩnh viễn, không phải vì có CVE. `packages: read` ở trên là phần
      # quyền tương ứng cho GITHUB_TOKEN.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln

# Alertmanager — BẢN MẪU (không chứa secret).
# Cách dùng trên host (CT102):
#   cd /opt/kg/ops/alertmanager
#   cp alertmanager.example.yml alertmanager.yml
#   printf '%s' '<gmail-app-password>' > smtp_password        # printf, KHÔNG echo (tránh newline)
#   printf '%s' '<telegram-bot-token>' > telegram_bot_token
#   chown root:nogroup alertmanager.yml smtp_password telegram_bot_token
#   chmod 0640 alertmanager.yml smtp_password telegram_bot_token   # container chay uid nobody (65534)
# Cả 3 file trên đều bị .gitignore → secret không bao giờ vào git.
# Secret KHÔNG nằm trong file này: Alertmanager đọc qua smtp_auth_password_file /
# bot_token_file, nhờ vậy `amtool check-config` và config dump không lộ giá trị.
# Luu y: KHONG bat --config.expand-env cho file nay.

# Alertmanager — project ops riêng (kgops), KHÔNG nằm trong docker-compose.prod.yml
# để lần `docker compose up -d --remove-orphans` của CI không xoá nó.
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'mtpquangbao@gmail.com'
  smtp_auth_username: 'mtpquangbao@gmail.com'
  smtp_auth_password_file: /etc/alertmanager/smtp_password
  smtp_require_tls: true

route:
  receiver: email-ops
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical (app down, đang bị đánh...) → Telegram + email, phản hồi nhanh.
    - matchers: ['severity="critical"']
      receiver: ops-critical
      group_wait: 10s
      repeat_interval: 1h

# App chết thì đừng spam thêm warning về heap/5xx của chính app đó.
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['job']

receivers:
  - name: email-ops
    email_configs:
      - to: 'mtpquangbao@gmail.com'
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }} Knowledge Gym - {{ .CommonLabels.alertname }}'

  # Critical: bắn CẢ Telegram (đọc ngay trên điện thoại, kể cả lúc đang bị đánh)
  # LẪN email (lưu vết). Token bot + chat id điền trên host, KHÔNG commit.
  # Bot dùng chung với Hermes: chat id = chat Telegram của chủ hệ thống.
  - name: ops-critical
    email_configs:
      - to: 'mtpquangbao@gmail.com'
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }} Knowledge Gym - {{ .CommonLabels.alertname }}'
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_bot_token
        chat_id: REPLACE_ME_TELEGRAM_CHAT_ID
        parse_mode: HTML
        send_resolved: true
        message: |-
          {{ if eq .Status "firing" }}🔥 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} · {{ .CommonLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          <i>runbook: docs/29-ddos-protection.md</i>

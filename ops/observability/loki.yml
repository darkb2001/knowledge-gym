# Single tenant; private network. Grafana is the access boundary.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: kg_logs_
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 1
  delete_request_store: filesystem
limits_config:
  retention_period: 72h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_global_streams_per_user: 200
  max_line_size: 64KB
  max_entries_limit_per_query: 2000
  max_query_parallelism: 2
  split_queries_by_interval: 1h
  reject_old_samples: true
  reject_old_samples_max_age: 72h
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name, deployment.environment.name]
        - action: drop
          regex: .*
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32
querier:
  max_concurrent: 2
ingester:
  chunk_idle_period: 5m
  max_chunk_age: 1h
  chunk_target_size: 1048576
  wal:
    enabled: true
    dir: /loki/wal
    replay_memory_ceiling: 64MB
analytics:
  reporting_enabled: false

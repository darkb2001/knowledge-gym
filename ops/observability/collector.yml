extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: ${env:OTEL_STATE_DIR}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 2
      http:
        endpoint: 0.0.0.0:4318
  filelog/docker:
    # Narrow read-only bind, not /var/lib/docker or docker.sock.
    include: ["${env:DOCKER_LOG_ROOT}/*/*-json.log"]
    start_at: end
    storage: file_storage
    poll_interval: 1s
    max_log_size: 64KiB
    max_concurrent_files: 64
    operators:
      - type: json_parser
        id: docker
        parse_to: attributes.docker
        timestamp:
          parse_from: attributes.docker.time
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
        on_error: drop_quiet
      - type: filter
        id: selected-services
        expr: >-
          attributes.docker.attrs == nil or
          attributes.docker.attrs["telemetry.service"] not in
          ["knowledge-gym", "nginx", "prometheus", "grafana", "alertmanager"]
      - type: move
        from: attributes.docker.attrs["telemetry.service"]
        to: resource["service.name"]
      - type: move
        from: attributes.docker.attrs["telemetry.environment"]
        to: resource["deployment.environment.name"]
      - type: json_parser
        id: structured-only
        parse_from: attributes.docker.log
        parse_to: body
        on_error: drop_quiet
      - type: remove
        field: attributes.docker
      - type: severity_parser
        parse_from: body.level
        on_error: send_quiet
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  # Fail closed: never forward an unstructured record or an arbitrary
  # library map.
  filter/log-schema:
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMap(body)'
        - 'resource.attributes["service.name"] == nil'
        - 'resource.attributes["deployment.environment.name"] == nil'
  transform/logs:
    error_mode: propagate
    log_statements:
      - context: resource
        statements:
          - >-
              keep_keys(attributes, ["service.name",
              "deployment.environment.name"])
      - context: log
        statements:
          - >-
              keep_keys(body, ["timestamp", "service", "environment", "level",
              "logger", "message", "trace_id", "span_id", "request_id",
              "user_id", "http_method", "http_route", "http_status", "duration_ms",
              "stack_trace", "status", "upstream_status", "duration_seconds",
              "upstream_duration_seconds", "request_bytes", "response_bytes"])
          - >-
              set(body["message"], "infrastructure_event") where
              resource.attributes["service.name"] != "knowledge-gym" and
              resource.attributes["service.name"] != "nginx"
          - >-
              delete_key(body, "stack_trace") where
              resource.attributes["service.name"] != "knowledge-gym"
          - >-
              delete_key(body, "http_route") where
              resource.attributes["service.name"] != "knowledge-gym"
          - >-
              delete_key(body, "user_id") where
              resource.attributes["service.name"] != "knowledge-gym"
          - >-
              delete_key(body, "logger") where
              resource.attributes["service.name"] != "knowledge-gym"
          - >-
              set(trace_id.string, body["trace_id"]) where
              IsString(body["trace_id"]) and IsMatch(body["trace_id"],
              "^[0-9a-f]{32}$")
          - >-
              set(span_id.string, body["span_id"]) where
              IsString(body["span_id"]) and IsMatch(body["span_id"],
              "^[0-9a-f]{16}$")
          # Fail closed on shapes that could carry a raw URI/query or a person:
          # a value that does not match is deleted, not merely left unpublished.
          # The app validates first (SafeJsonEncoder); this is the last gate
          # before Loki, which never receives a raw path, query or email.
          - >-
              delete_key(body, "http_route") where IsString(body["http_route"])
              and not IsMatch(body["http_route"],
              "^(_unmatched|/[A-Za-z0-9_{}/.-]{0,159})$")
          - >-
              delete_key(body, "user_id") where IsString(body["user_id"]) and
              not IsMatch(body["user_id"],
              "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")
          # Publish them as log-record attributes: Loki stores OTLP log
          # attributes as structured metadata, so `| user_id="..."` and
          # `| http_route="..."` filter without `| json` and without touching
          # stream labels (no index cardinality). trace_id/span_id are already
          # native log-record fields with the same property.
          - >-
              set(attributes["http_route"], body["http_route"]) where
              resource.attributes["service.name"] == "knowledge-gym" and
              IsString(body["http_route"])
          - >-
              set(attributes["user_id"], body["user_id"]) where
              resource.attributes["service.name"] == "knowledge-gym" and
              IsString(body["user_id"])
          # Attribute allowlist: nothing else may survive to the exporter.
          - 'keep_keys(attributes, ["http_route", "user_id"])'
  # Typed event/link slices cannot be replaced by an OTTL [] literal.
  # Remove events with filterprocessor. Reject linked spans fail-closed;
  # the agent is configured not to create links (see deployment trade-off).
  filter/span-safety:
    error_mode: propagate
    traces:
      span:
        - 'Len(links) > 0'
      spanevent:
        - 'true'
  transform/traces:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - >-
              keep_keys(attributes, ["service.name", "service.version",
              "deployment.environment.name"])
      - context: span
        statements:
          # Avoid URL/query/SQL/Redis/Kafka payload/user/baggage/exception PII.
          - >-
              keep_keys(attributes, ["http.request.method", "http.route",
              "http.response.status_code", "db.system", "db.system.name",
              "db.operation", "db.operation.name", "messaging.system",
              "messaging.destination.name", "messaging.operation.name",
              "error.type"])
          - 'set(name, "operation")'
          - 'set(name, "server") where kind == SPAN_KIND_SERVER'
          - 'set(name, "client") where kind == SPAN_KIND_CLIENT'
          - 'set(name, "producer") where kind == SPAN_KIND_PRODUCER'
          - 'set(name, "consumer") where kind == SPAN_KIND_CONSUMER'
          - >-
              set(name, Concat(["HTTP", attributes["http.request.method"],
              attributes["http.route"]], " ")) where attributes["http.route"] !=
              nil and attributes["http.request.method"] != nil
          - 'set(status.message, "")'
          - 'set(trace_state, "")'
          - 'keep_keys(scope.attributes, [])'
  batch/logs:
    timeout: 2s
    send_batch_size: 256
    send_batch_max_size: 512
  batch/traces:
    timeout: 2s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 3s
    compression: gzip
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 64
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 3s
    compression: gzip
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 64
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
                without_scope_info: true
  pipelines:
    logs:
      receivers: [filelog/docker]
      processors:
        [memory_limiter, filter/log-schema, transform/logs, batch/logs]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors:
        [memory_limiter, filter/span-safety, transform/traces, batch/traces]
      exporters: [otlp/tempo]

spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
server:
  # Tomcat đọc X-Forwarded-Proto/Host/Port để dựng redirect_uri của OAuth2 và
  # scheme của URL. Thiếu dòng này (mặc định `none`) thì sau Cloudflare Tunnel
  # Spring vẫn tưởng request là http://api:8080, nên redirect_uri gửi Google
  # không khớp cái đã đăng ký → OAuth login fail.
  forward-headers-strategy: native

app:
  ops:
    backup-script: ${KG_BACKUP_SCRIPT:/opt/kg/scripts/backup-db.sh}
    es-control-script: >-
      ${KG_ES_CONTROL_SCRIPT:/opt/kg/scripts/es-control.sh}
  email:
    # SMTP is opt-in in production. Set MAIL_SMTP_ENABLED=true only when
    # MAIL_USERNAME and MAIL_PASSWORD are configured.
    smtp-enabled: ${MAIL_SMTP_ENABLED:false}
  security:
    swagger-enabled: false
    jwt:
      access-secret: ${JWT_ACCESS_SECRET}
      refresh-secret: ${JWT_REFRESH_SECRET}
    cookie:
      secure: true
      # FE = app.darkb-tech.io.vn, API = api.darkb-tech.io.vn → cùng registrable
      # domain nên cookie là same-site; Strict bảo vệ CSRF mà không cần None.
      # Không dùng None nữa: browser hiện đại coi đây là third-party cookie.
      same-site: Strict
    trust-forwarded-headers: true
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    oauth2:
      success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

logging:
  level:
    com.knowledgegym: INFO
    org.hibernate.SQL: WARN

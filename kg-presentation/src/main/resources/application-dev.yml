app:
  email:
    smtp-enabled: false
  security:
    swagger-enabled: true
    jwt:
      access-secret: >-
        ${JWT_ACCESS_SECRET:dev-access-secret-minimum-32-characters-long-for-jwt-signing}
      refresh-secret: >-
        ${JWT_REFRESH_SECRET:dev-refresh-secret-minimum-32-characters-long-for-jwt-sign}
    cookie:
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    oauth2:
      success-redirect-uri: >-
        ${OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/auth/oauth2/success}
      failure-redirect-uri: >-
        ${OAUTH2_FAILURE_REDIRECT:http://localhost:3000/auth/oauth2/error}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.knowledgegym: DEBUG
    org.hibernate.SQL: INFO

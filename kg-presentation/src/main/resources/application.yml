spring:
  application:
    name: knowledge-gym
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledgegym}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

app:
  email:
    smtp-enabled: false
    from: no-reply@knowledgegym.dev
  security:
    jwt:
      access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-minimum-32-characters-long-for-jwt-signing}
      refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-minimum-32-characters-long-for-jwt-sign}
    cookie:
      # Secure=false ở dev (http://localhost) — prod set true (https)
      secure: ${REFRESH_COOKIE_SECURE:false}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    com.knowledgegym: DEBUG
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

app:
  email:
    smtp-enabled: true
  security:
    cookie:
      secure: true
    trust-forwarded-headers: true  # nginx → app

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.knowledgegym: INFO
    org.hibernate.SQL: WARN
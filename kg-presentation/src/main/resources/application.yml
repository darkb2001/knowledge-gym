spring:
  application:
    name: knowledge-gym
  profiles:
    active: dev
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledgegym}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

app:
  version: ${APP_VERSION:0.4.0}
  progress:
    timezone: ${APP_PROGRESS_TIMEZONE:Asia/Ho_Chi_Minh}
  blog:
    canonical-base-url: ${BLOG_CANONICAL_BASE_URL:http://localhost:3000}
    collector:
      enabled: ${APP_BLOG_COLLECTOR_ENABLED:false}
      poll-ms: ${APP_BLOG_COLLECTOR_POLL_MS:600000}
    kafka:
      enabled: ${APP_BLOG_KAFKA_ENABLED:false}
    outbox:
      poll-ms: ${APP_BLOG_OUTBOX_POLL_MS:5000}
  email:
    smtp-enabled: false
    from: no-reply@knowledgegym.dev
  content:
    # `docs/` nằm ngoài git root của repo (knowledge-gym/) — CI không có.
    # Local dev: ../docs. Container: mount volume + CONTENT_DOCS_PATH=/content/docs.
    docs-path: ${CONTENT_DOCS_PATH:../docs}
    parse-parallelism: ${CONTENT_PARSE_PARALLELISM:4}
  cache:
    questions:
      # L1 Caffeine — nội dung tĩnh, đọc nhiều. Mutation của admin evict toàn bộ.
      max-size: 1000
      ttl: 30m
  security:
    # Swagger UI bật ở dev; prod tắt (xem block prod bên dưới).
    swagger-enabled: true
    jwt:
      access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-minimum-32-characters-long-for-jwt-signing}
      refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-minimum-32-characters-long-for-jwt-sign}
    cookie:
      # Secure=false ở dev (http://localhost) — prod set true (https)
      secure: ${REFRESH_COOKIE_SECURE:false}
      # SameSite: Strict khi FE cùng site (dev), None khi cross-site (prod).
      # SameSite=None BẮT BUỘC đi kèm Secure=true — đặt cookie.same-site=None mà secure=false
      # sẽ bị browser drop cookie.
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    oauth2:
      # FE callback — fragment #accessToken=... (must be absolute http(s))
      success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/auth/oauth2/success}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    com.knowledgegym: DEBUG
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

server:
  port: 8080
  servlet:
    # Khớp docs/08-rest-api.md + infra/nginx.conf (`location /api/v1/auth/`).
    # AuthController mapping vẫn là `/auth/*`; context-path được thêm ở tầng servlet.
    context-path: /api/v1

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

app:
  email:
    smtp-enabled: true
  security:
    # Không lộ API docs ở prod.
    swagger-enabled: false
    cookie:
      secure: true
      # FE ở domain khác → cross-site cookie. Bắt buộc đi kèm secure=true.
      same-site: None
    trust-forwarded-headers: true  # nginx → app

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.knowledgegym: INFO
    org.hibernate.SQL: WARN

spring:
  application:
    name: knowledge-gym
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        enable.idempotence: true
        acks: all
        delivery.timeout.ms: 120000
    consumer:
      enable-auto-commit: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledgegym}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    # Short timeouts let AUTO/ELASTICSEARCH fall back to Postgres quickly.
    connection-timeout: ${SPRING_ELASTICSEARCH_CONNECTION_TIMEOUT:2s}
    socket-timeout: ${SPRING_ELASTICSEARCH_SOCKET_TIMEOUT:2s}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      # AvatarUseCase chặn ở 2 MB; servlet cần biên rộng hơn cho overhead của multipart.
      max-file-size: 4MB
      max-request-size: 5MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

app:
  version: ${APP_VERSION:0.4.0}
  api:
    # Base URL công khai của API (đã gồm context-path `/api/v1`): dùng để dựng URL ảnh đại diện.
    public-base-url: ${APP_API_PUBLIC_BASE_URL:http://localhost:8080}
  cron:
    mode: ${APP_CRON_MODE:embedded}
    token: ${CRON_TOKEN:}
  ops:
    # Prefer HTTP agent on Docker bridge gateway (CT102).
    # App containers cannot reach 127.0.0.1.
    es-control-url: ${KG_ES_CONTROL_URL:}
    es-control-token: ${KG_ES_CONTROL_TOKEN:}
    # Legacy fallback: ProcessBuilder to a script on the JVM host.
    # It is not executed in the app container.
    backup-script: ${KG_BACKUP_SCRIPT:}
    es-control-script: ${KG_ES_CONTROL_SCRIPT:}
    script-timeout-seconds: ${KG_SCRIPT_TIMEOUT_SECONDS:900}
  progress:
    timezone: ${APP_PROGRESS_TIMEZONE:Asia/Ho_Chi_Minh}
  blog:
    canonical-base-url: ${BLOG_CANONICAL_BASE_URL:http://localhost:3000}
    writer:
      enabled: ${APP_BLOG_WRITER_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      # 9router custom model; override OPENAI_MODEL for another provider.
      model: ${OPENAI_MODEL:vibe-daily}
      input-usd-per-million: ${OPENAI_INPUT_USD_PER_MILLION:0.15}
      output-usd-per-million: ${OPENAI_OUTPUT_USD_PER_MILLION:0.60}
      daily-request-limit: ${APP_BLOG_WRITER_DAILY_REQUEST_LIMIT:20}
      daily-token-limit: ${APP_BLOG_WRITER_DAILY_TOKEN_LIMIT:80000}
      daily-cost-limit-usd: ${APP_BLOG_WRITER_DAILY_COST_LIMIT_USD:10}
      monthly-cost-alert-usd: ${APP_BLOG_WRITER_MONTHLY_COST_ALERT_USD:10}
      poll-ms: ${APP_BLOG_WRITER_POLL_MS:30000}
      initial-delay-ms: ${APP_BLOG_WRITER_INITIAL_DELAY_MS:20000}
    collector:
      enabled: ${APP_BLOG_COLLECTOR_ENABLED:false}
      poll-ms: ${APP_BLOG_COLLECTOR_POLL_MS:600000}
    knowledge-intake:
      enabled: ${APP_BLOG_KNOWLEDGE_INTAKE_ENABLED:false}
      poll-ms: ${APP_BLOG_KNOWLEDGE_INTAKE_POLL_MS:30000}
      initial-delay-ms: ${APP_BLOG_KNOWLEDGE_INTAKE_INITIAL_DELAY_MS:20000}
    kafka:
      enabled: ${APP_BLOG_KAFKA_ENABLED:false}
    outbox:
      poll-ms: ${APP_BLOG_OUTBOX_POLL_MS:5000}
  search:
    elasticsearch:
      # Mặc định TẮT. Khi tắt, `GET /search` chạy đúng câu tsvector cũ — hành vi
      # không đổi so với trước khi có ES.
      enabled: ${APP_SEARCH_ES_ENABLED:false}
      index: ${APP_SEARCH_ES_INDEX:knowledge-gym-search}
      poll-ms: ${APP_SEARCH_ES_POLL_MS:5000}
      # Re-seed index từ bảng nguồn mỗi lần khởi động.
      # Trigger chỉ bắt được write,
      # nên content tạo lúc tính năng đang tắt sẽ thiếu vĩnh viễn nếu không làm.
      # Upsert theo id nên idempotent; tắt chỉ khi chủ động muốn giữ index cũ.
      reindex-on-startup: ${APP_SEARCH_ES_REINDEX_ON_STARTUP:true}
    outbox:
      # search_outbox là hàng đợi công việc có biên, KHÔNG phải nguồn sự thật.
      # Row quá hạn bị xoá kể cả còn pending, vì index được dựng lại từ bảng
      # nguồn khi khởi động. Không dọn thì khi ES tắt bảng phình vô hạn.
      retention-days: ${APP_SEARCH_OUTBOX_RETENTION_DAYS:7}
      prune-ms: ${APP_SEARCH_OUTBOX_PRUNE_MS:3600000}
  email:
    smtp-enabled: false
    kafka-enabled: ${MAIL_KAFKA_ENABLED:false}
    from: no-reply@knowledgegym.dev
    # Tên hiển thị người gửi — phần duy nhất giữ được thương hiệu khi Gmail buộc header From về tài khoản gửi.
    from-name: ${APP_EMAIL_FROM_NAME:Knowledge Gym}
  content:
    # `docs/` nằm ngoài git root của repo (knowledge-gym/) — CI không có.
    # Local dev: ../docs. Container: mount volume + CONTENT_DOCS_PATH
    # is mounted as /content/docs in the container.
    docs-path: ${CONTENT_DOCS_PATH:../docs}
    parse-parallelism: ${CONTENT_PARSE_PARALLELISM:4}
  cache:
    questions:
      # L1 Caffeine — nội dung tĩnh, đọc nhiều.
      # Mutation của admin evict toàn bộ.
      max-size: 1000
      ttl: 30m
  turnstile:
    # Bật enforcement ở BE. Mặc định tắt để deploy code trước, gắn secret sau:
    # FE đã render widget từ trước nên khi bật không có khoảng chết với người dùng.
    enabled: ${TURNSTILE_ENABLED:false}
    secret: ${TURNSTILE_SECRET:}
    verify-url: ${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
    timeout-ms: ${TURNSTILE_TIMEOUT_MS:3000}
    # Cloudflare sự cố/timeout: ưu tiên không chặn người dùng thật (log WARN để còn phát hiện).
    fail-open: ${TURNSTILE_FAIL_OPEN:true}
  security:
    swagger-enabled: false
    jwt:
      access-secret: ${JWT_ACCESS_SECRET:}
      refresh-secret: ${JWT_REFRESH_SECRET:}
    refresh:
      # Hạn tuyệt đối của một phiên (kể từ login đầu tiên) — rolling TTL 7 ngày vẫn gia hạn,
      # nhưng sau mốc này buộc đăng nhập lại. 30d = 30 ngày; đặt 0 để tắt.
      absolute-family-ttl: ${REFRESH_ABSOLUTE_TTL:30d}
    cookie:
      # FE (app.darkb-tech.io.vn) và API (api.darkb-tech.io.vn) cùng registrable
      # domain nên cookie là same-site → Strict, không cần None.
      # None là third-party
      # cookie và browser hiện đại chặn (xem application-prod.yml).
      #
      # Base cố ý không hardcode `secure: true`:
      # test profile override secure=false
      # để chạy trên HTTP. Nếu base giữ same-site=None thì tổ hợp
      # làm RefreshTokenCookie throw lúc khởi tạo context, khiến mọi Spring
      # test chết.
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    # Tắt CSRF filter vì auth dùng Bearer trong bộ nhớ + SameSite=Strict cookie. Filter này là
    # lớp độc lập thứ hai: request mang refresh cookie phải có Origin/Referer thuộc allowlist.
    csrf:
      origin-guard: ${ORIGIN_GUARD_ENABLED:true}
    trust-forwarded-headers: true
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    oauth2:
      success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT:}
      failure-redirect-uri: >-
        ${OAUTH2_FAILURE_REDIRECT:http://localhost:3000/auth/oauth2/error}

storage:
  s3:
    enabled: ${STORAGE_S3_ENABLED:false}
    endpoint: ${S3_ENDPOINT:http://localhost:3900}
    # Hostname mà browser gọi được, dùng để KÝ presigned URL. Trong Compose đây
    # phải là hostname public (S3_PUBLIC_ENDPOINT), không phải `garage:3900` —
    # ký bằng DNS nội bộ thì client không resolve được và upload fail im lặng.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:garage}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    # Bucket chứa object do server ghi (avatar). Browser không truy cập bucket này trực tiếp.
    objects-bucket: ${S3_OBJECT_BUCKET:kg-local}

resilience4j:
  circuitbreaker:
    instances:
      blogWriter:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      blogWriter:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  ratelimiter:
    instances:
      blogWriter:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
    elasticsearch:
      # Tắt health indicator ES: search degrade sang PostgreSQL khi ES chết.
      # (xem GlobalSearchUseCase), nên ES down không phải là app unhealthy —
      # để nguyên
      # sẽ khiến /actuator/health trả DOWN và mọi probe/alert báo động sai.
      enabled: ${APP_SEARCH_ES_HEALTH_ENABLED:false}

logging:
  level:
    com.knowledgegym: DEBUG
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

server:
  port: 8080
  servlet:
    # Khớp docs/08-rest-api.md + infra/nginx.conf (`location /api/v1/auth/`).
    # AuthController mapping vẫn là `/auth/*`;
    # context-path được thêm ở tầng servlet.
    context-path: /api/v1

# Test profile — m3: Postgres + Redis từ Testcontainers (không exclude Redis autoconfig nữa)
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          # Dummy values — Spring Boot reject registration có client-id rỗng.
          # Test không gọi Google thật; OAuth2 login flow test bằng MockMvc redirect.
          google:
            client-id: test-client-id.apps.googleusercontent.com
            client-secret: test-client-secret

# JWT secrets + cookie flags cho test (không cần env vars)
app:
  security:
    jwt:
      access-secret: test-access-secret-minimum-32-characters-for-jwt
      refresh-secret: test-refresh-secret-minimum-32-characters-for-jwt
    cookie:
      # Test chạy trên HTTP nên secure=false; same-site nêu rõ để profile này tự chứa,
      # không phụ thuộc default của application.yml.
      secure: false
      same-site: Strict
    # Tests dùng X-Forwarded-For để cách ly rate-limit buckets giữa các test case
    trust-forwarded-headers: true
    cors:
      allowed-origins: http://localhost:3000
    oauth2:
      # Base để trống (prod phải cấp qua env) nên test phải tự set: OAuth2SuccessHandler
      # validate absolute http(s) lúc khởi tạo và throw nếu nhận chuỗi rỗng.
      success-redirect-uri: http://localhost:3000/auth/oauth2/success
  email:
    smtp-enabled: false

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: false  # Not Kubernetes — disable readiness check that returns 503
  health:
    mail:
      enabled: false  # Không có SMTP thật trong test — tránh mail indicator DOWN → 503
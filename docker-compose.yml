services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # docs/ nằm ngoài git root của repo — không nhúng vào image, mount read-only.
      - ../docs:/content/docs:ro
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONTENT_DOCS_PATH: /content/docs
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/knowledgegym
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_BLOG_COLLECTOR_ENABLED: "true"
      APP_BLOG_KAFKA_ENABLED: "true"
      APP_BLOG_WRITER_ENABLED: ${APP_BLOG_WRITER_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-0.15}
      OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-0.60}
      APP_BLOG_WRITER_DAILY_REQUEST_LIMIT: ${APP_BLOG_WRITER_DAILY_REQUEST_LIMIT:-20}
      APP_BLOG_WRITER_DAILY_TOKEN_LIMIT: ${APP_BLOG_WRITER_DAILY_TOKEN_LIMIT:-80000}
      APP_BLOG_WRITER_DAILY_COST_LIMIT_USD: ${APP_BLOG_WRITER_DAILY_COST_LIMIT_USD:-10}
      APP_BLOG_WRITER_MONTHLY_COST_ALERT_USD: ${APP_BLOG_WRITER_MONTHLY_COST_ALERT_USD:-10}
      BLOG_CANONICAL_BASE_URL: ${BLOG_CANONICAL_BASE_URL:-http://localhost}
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,info
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-kgadmin01}
      S3_SECRET_KEY: ${GARAGE_SECRET_KEY:-kgsecret1234567890}
      S3_BUCKET_IMAGES: kg-blog-images
      S3_BUCKET_AVATARS: kg-avatars
      S3_BUCKET_EXPORTS: kg-exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      garage:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledgegym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # bitnami/kafka archived 2025-08-15 → official apache/kafka KRaft mode
    # Dual listeners: docker network (kafka:29092) + host tooling (localhost:9092).
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: "knowledge-gym-dev-cluster"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  garage:
    # dxflrs/garage (upstream Deuxfleurs, maintained actively)
    # garage CLI: global flags (-c) come BEFORE subcommand (server)
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "-c", "/etc/garage.toml", "server", "--single-node", "--default-bucket"]
    volumes:
      - garage-data:/data
      - ./infra/garage.toml:/etc/garage.toml:ro
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # Admin/metrics API
      - "3902:3902"   # Web (bucket browser)
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-admin}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-kg-local}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-kgadmin01}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:-kgsecret1234567890}
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # `infra/prometheus.yml` khai báo `rule_files: /etc/prometheus/alerts.yml`.
      # Thiếu mount này Prometheus fail lúc load config ("no such file or directory")
      # chứ không chỉ bỏ qua rules — dev compose phải mount cùng path với prod.
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
      # Provisioning giống prod để datasource/dashboard hỏng ở dev là thấy ngay.
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  redis-data:
  kafkadata:
  esdata:
  garage-data:
  promdata:
  grafanadata:

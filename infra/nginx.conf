# Nginx — cổng vào hệ thống (reverse proxy + load balancer)
# Module 09 (System Design): load balancing, SSL termination, caching tĩnh
#
# File này mount vào /etc/nginx/conf.d/default.conf → được include trong http {}
# nên khai báo limit_req_zone ở đây (context http) là hợp lệ.

# Rate limit zone: 10 req/s cho auth endpoints, burst 10
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

upstream knowledge_gym_backend {
    # Khi scale > 1 app instances, thêm server app-2:8080 tại đây
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    # Frontend Next.js (production: next build output qua CDN/host riêng)
    location /_next/static/ {
        proxy_pass http://knowledge_gym_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # REST API
    location /api/ {
        proxy_pass http://knowledge_gym_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Actuator + Prometheus scrape (internal only — không expose ra internet).
    # Context-path `/api/v1` áp dụng cho cả management endpoint, nên path ở đây phải có prefix.
    location /api/v1/actuator/prometheus {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://knowledge_gym_backend;
    }

    location /api/v1/actuator/health {
        proxy_pass http://knowledge_gym_backend;
    }

    # Swagger UI cũng nằm dưới context-path (springdoc tính path tương đối với context-path).
    location /api/v1/swagger-ui/ {
        proxy_pass http://knowledge_gym_backend;
    }

    location /api/v1/v3/api-docs/ {
        proxy_pass http://knowledge_gym_backend;
    }

    # Rate limit auth endpoints tại edge (bên ngoài Bucket4j trong app)
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://knowledge_gym_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://knowledge_gym_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

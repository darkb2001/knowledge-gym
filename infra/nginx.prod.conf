# Nginx — API gateway cho Knowledge Gym production (CT 102).
#
# Khác với `infra/nginx.conf` (dev):
#   - Tin client IP chỉ từ cloudflared (CF-Connecting-IP), chống spoof XFF.
#   - Có `/stub_status` để Prometheus scrape (job "nginx" trong prometheus.yml).
#   - KHÔNG proxy Swagger UI (prod tắt springdoc).
#   - Không có `location /` → FE host ngoài, nginx chỉ phục vụ API.
#
# File này mount vào /etc/nginx/conf.d/default.conf nên khai báo limit_req_zone
# (context http) ở đây là hợp lệ.

# Rate limit tầng edge (ngoài Bucket4j trong app).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

# Trần SỐ KẾT NỐI đồng thời trên mỗi IP. Rate limit theo request không thấy được
# slowloris / connection flood (mỗi kết nối chỉ gửi 1 request, gửi rất chậm).
# $binary_remote_addr ở đây là IP thật: module realip (post-read phase) chạy
# TRƯỚC khi limit_conn tính khoá, nên qua tunnel vẫn tính đúng theo khách.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Bị chặn vì rate limit phải là 429 (Too Many Requests) chứ không phải 503:
# 503 = "server lỗi" (FE dễ retry/che giấu), 429 = "bạn bị chặn, đừng gửi nữa".
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# Không lộ phiên bản nginx cho scanner.
server_tokens off;

# Cloudflare Tunnel connects to nginx over HTTP, but preserves the original
# client scheme in X-Forwarded-Proto. Trust only the tunnel's forwarded value
# and default to HTTPS for direct production requests.
map $http_x_forwarded_proto $kg_client_proto {
    default https;
    ~*^http$ http;
    ~*^https$ https;
}

# ---------------------------------------------------------------------------
# Real client IP.
#
# Luồng: browser → Cloudflare edge → cloudflared (container cùng mạng Docker)
#        → nginx. Nên $remote_addr mà nginx thấy là IP của cloudflared, còn IP
#        thật nằm ở header CF-Connecting-IP do Cloudflare set.
#
# `set_real_ip_from` chỉ tin các dải mạng Docker: ai không nằm trong đó (tức là
# kết nối trực tiếp, không qua cloudflared) không thể tự khai IP bằng header.
# Nếu chuyển sang NPM (CT100): đổi dòng real_ip_header thành X-Forwarded-For và
# thêm IP của CT100 vào set_real_ip_from.
# ---------------------------------------------------------------------------
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# No raw URI/query/IP/user-agent/body/header fields. JSON escaping prevents
# log injection. Trace ID comes only from the upstream application response.
map $request_method $kg_log_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}
log_format kg_json escape=json
    '{"timestamp":"$time_iso8601","service":"nginx",'
    '"environment":"edge","level":"INFO","message":"http_edge_completed",'
    '"request_id":"$request_id","trace_id":"$upstream_http_x_trace_id",'
    '"http_method":"$kg_log_method","status":$status,'
    '"upstream_status":"$upstream_status",'
    '"duration_seconds":$request_time,'
    '"upstream_duration_seconds":"$upstream_response_time",'
    '"request_bytes":$request_length,"response_bytes":$body_bytes_sent}';
access_log /dev/stdout kg_json;
# Native error lines echo request URLs/query strings and cannot be safely
# formatted/redacted, so they are never shipped to Loki (the collector's JSON
# gate drops them). Keep them on stderr for local `docker logs` diagnosis:
# /dev/null would hide worker/upstream/TLS failures entirely.
error_log /dev/stderr crit;

upstream knowledge_gym_backend {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.darkb-tech.io.vn;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $request_id always;

    # --- Chống lạm dụng / DDoS ở tầng edge (xem docs/29-ddos-protection.md) ---
    # Trần kết nối đồng thời mỗi IP: chặn slowloris/R.U.D.Y (mở rất nhiều kết nối,
    # gửi request rất chậm) — thứ mà limit_req theo request không phát hiện được.
    limit_conn conn_per_ip 60;
    # Kết nối mở mà không gửi header/body kịp thì bị ngắt, không giữ slot.
    client_header_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 20s;
    # Kill-switch thủ công khi đang bị tấn công: thêm dòng `deny <ip>;` vào
    # /opt/kg/run/blocklist/attack.conf rồi `docker exec kg-nginx-1 nginx -s reload`.
    # Thư mục rỗng nên include không nạp file .conf nào (không lỗi cú pháp).
    include /etc/nginx/blocklist/*.conf;

    # Drop malformed Host headers at the edge so Tomcat does not log parser
    # noise for internet scanners (valid DNS hostnames only).
    if ($host !~* ^[a-z0-9.-]+$) { return 444; }

    # Ảnh/avatar upload vượt mặc định 1m sẽ bị 413 mà không rõ nguyên nhân.
    client_max_body_size 10m;
    client_body_timeout 30s;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    # Healthcheck cho cloudflared / smoke test — không lộ thông tin nội bộ.
    location = /api/v1/actuator/health {
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_pass http://knowledge_gym_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $kg_client_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
    # Prometheus scrape. Chỉ cho phép mạng Docker nội bộ — không ra internet.
    # App phải permitAll GET /actuator/prometheus (xem SecurityConfig), nếu không
    # sẽ trả 401 và Grafana im lặng trống.
    location = /api/v1/actuator/prometheus {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_pass http://knowledge_gym_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $kg_client_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # nginx self-metrics cho Prometheus (job "nginx").
    location = /stub_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
    }

    # Auth: rate limit chặt hơn ở edge.
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_pass http://knowledge_gym_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # XFF do chính nginx ghi lại từ $remote_addr (đã qua real_ip).
        # KHÔNG dùng $proxy_add_x_forwarded_for: nó nối XFF client gửi vào,
        # mà ClientIpResolver lấy phần tử đầu tiên → client tự khai IP là qua
        # mặt được rate limit và bơm IP giả vào audit log.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $kg_client_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_pass http://knowledge_gym_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $kg_client_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Không có route nào khác: FE host ngoài, nginx thuần API gateway.
    location / {
        return 404;
    }
}

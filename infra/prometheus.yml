# Prometheus — thu thập metrics từ Spring Boot Actuator (/actuator/prometheus)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "knowledge-gym"
    # context-path /api/v1 áp dụng cho management endpoints → phải có prefix,
    # nếu không scrape sẽ 404 và dashboard im lặng trống.
    metrics_path: "/api/v1/actuator/prometheus"
    static_configs:
      - targets: ["app:8080"]
        labels:
          env: "local"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
    # nginx stub_status cần module — optional, bỏ qua nếu không enable

alerting:
  alertmanagers: []

rule_files: []

# Prometheus — thu thập metrics từ Spring Boot Actuator.
#
# Scrape đi qua nginx (`nginx:80`) để hưởng allowlist/deny của nó, và vì
# `server.servlet.context-path=/api/v1` áp dụng cho CẢ management endpoint —
# thiếu prefix `/api/v1` thì scrape nhận 404 và dashboard im lặng trống.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "knowledge-gym"
    metrics_path: "/api/v1/actuator/prometheus"
    static_configs:
      - targets: ["nginx:80"]
        labels:
          # Trung tính cho cả dev và prod (cùng file). Chưa có dashboard nào
          # provision trong repo nên đổi nhãn không phá gì.
          env: "self-hosted"

  # nginx self-metrics. Cần `stub_status` trong config nginx (đã có trong
  # infra/nginx.prod.conf tại `location = /stub_status`).
  # KHÔNG trỏ vào `nginx:80` với path mặc định `/metrics`: nginx không tự expose
  # Prometheus format, và nó sẽ trả 404 mỗi 15s → target DOWN vĩnh viễn.
  - job_name: "nginx"
    metrics_path: "/stub_status"
    static_configs:
      - targets: ["nginx:80"]

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/alerts.yml

# Offsite metrics (m11b): keep local scrape/dashboards; add Grafana Cloud Free
# remote_write so history survives host death. Copy
# infra/prometheus/remote_write.yml.example → host-only secrets file, then either
# merge into this file or mount an override. Alert
# KnowledgeGymPrometheusRemoteSamplesDiscarded fires when Free-tier series limit
# silently drops samples.
#
# remote_write: []
